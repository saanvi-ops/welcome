<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Blueprint Grid</title>
    <style>
        /* Centers the entire layout on your screen */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8fafc;
        }

        /* Scaled to 10 columns and 20 rows to easily fit your coordinates */
        .blueprint-grid {
            display: grid;
            grid-template-columns: repeat(10, 30px);
            grid-template-rows: repeat(20, 30px);
            
            background-color: #ffffff;
            /* Thin, clean grid layout lines matching graph paper */
            background-image: 
                linear-gradient(to right, #cbd5e1 1px, transparent 1px),
                linear-gradient(to bottom, #cbd5e1 1px, transparent 1px);
            background-size: 30px 30px;
            
            border: 2px solid #94a3b8;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        /* Solid black blocks */
        .black-square {
            background-color: #000000;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="blueprint-grid">
        <!-- ==================== PART 1: FLOWER SHAPE ==================== -->
        <div class="black-square" style="grid-row: 4; grid-column: 2;"></div>
        <div class="black-square" style="grid-row: 2; grid-column: 3;"></div>
        <div class="black-square" style="grid-row: 6; grid-column: 3;"></div>
        <div class="black-square" style="grid-row: 4; grid-column: 4;"></div>
        <div class="black-square" style="grid-row: 4; grid-column: 5;"></div>
        <div class="black-square" style="grid-row: 3; grid-column: 6;"></div>
        <div class="black-square" style="grid-row: 5; grid-column: 6;"></div>
        <div class="black-square" style="grid-row: 4; grid-column: 7;"></div>

        <!-- Empty Buffer Space: Rows 7, 8, and 9 are left completely blank -->

        <!-- ==================== PART 2: MIDDLE SHAPE ==================== -->
        <div class="black-square" style="grid-row: 10; grid-column: 2;"></div>
        <div class="black-square" style="grid-row: 11; grid-column: 2;"></div>
        <div class="black-square" style="grid-row: 10; grid-column: 4;"></div>

        <!-- Empty Buffer Space: Rows 12, 13, and 14 are left completely blank -->

        <!-- ==================== PART 3: LAST SHAPE ==================== -->
        <!-- Row 15 Dots -->
        <div class="black-square" style="grid-row: 15; grid-column: 3;"></div>
        <div class="black-square" style="grid-row: 15; grid-column: 5;"></div>
        <div class="black-square" style="grid-row: 15; grid-column: 7;"></div>
        
        <!-- Row 17 Dots -->
        <div class="black-square" style="grid-row: 17; grid-column: 2;"></div>
        <div class="black-square" style="grid-row: 17; grid-column: 4;"></div>
        <div class="black-square" style="grid-row: 17; grid-column: 6;"></div>
        <div class="black-square" style="grid-row: 17; grid-column: 8;"></div>
        
        <!-- Row 18 Dots -->
        <div class="black-square" style="grid-row: 18; grid-column: 3;"></div>
        <div class="black-square" style="grid-row: 18; grid-column: 7;"></div>
    </div>

</body>
</html>
